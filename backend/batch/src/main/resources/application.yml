spring:
  application:
    name: japanese-vocabulary-batch

  main:
    # CronJob 컨테이너. 웹 서버를 띄우지 않고 CronTaskRunner 가 끝나면 종료한다.
    web-application-type: none

  batch:
    job:
      # 기동만으로 모든 Job 이 돌면 안 된다. 실행할 작업은 --task 가 고른다.
      enabled: false

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:japanese_vocabulary}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 토폴로지는 브로커의 definitions 가 소유한다. 이름만 참조하고 선언하지 않는다.
    dynamic: false

apple-music:
  # MusicKit key that signs the catalog developer token. Blank boots but fails the first catalog call.
  team-id: ${APPLE_MUSIC_TEAM_ID:}
  key-id: ${APPLE_MUSIC_KEY_ID:}
  private-key-base64: ${APPLE_MUSIC_PRIVATE_KEY_BASE64:}

sentry:
  dsn: ${SENTRY_DSN_BATCH:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: 0.1
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info
