server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: japanese-vocabulary-api

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:japanese_vocabulary}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 토폴로지는 브로커가 부팅 때 읽는 definitions(k8s/{dev,prod}/rabbitmq/configmap.yaml)가 소유한다.
    # RabbitAdmin 을 띄우지 않아야 선언의 진실 원천이 하나로 남는다.
    dynamic: false

youtube:
  api-key: ${YOUTUBE_API_KEY}

github:
  # Fine-grained PAT with Issues: write on the repository below. Blank disables VOC submission.
  token: ${GITHUB_VOC_TOKEN:}
  repository: ${GITHUB_VOC_REPOSITORY:eastshine2741/japanese-vocabulary}

object-storage:
  # S3-compatible bucket (Cloudflare R2) for profile images. Any blank value disables uploads (503).
  endpoint: ${OBJECT_STORAGE_ENDPOINT:}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  bucket: ${OBJECT_STORAGE_BUCKET:}
  public-base-url: ${OBJECT_STORAGE_PUBLIC_BASE_URL:}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-at-least-32-chars-long}

google:
  oauth:
    # Web OAuth Client ID — used as audience when verifying Google ID tokens.
    # Same value passed as @react-native-google-signin's webClientId on the app side.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

apple:
  oauth:
    # iOS Bundle ID / Apple Service ID used as audience when verifying Sign in with Apple ID tokens.
    client-id: ${APPLE_OAUTH_CLIENT_ID:dev.eastshine.kotonoha}

apple-music:
  # MusicKit key that signs the catalog developer token. Blank boots but fails the first catalog call.
  team-id: ${APPLE_MUSIC_TEAM_ID:}
  key-id: ${APPLE_MUSIC_KEY_ID:}
  private-key-base64: ${APPLE_MUSIC_PRIVATE_KEY_BASE64:}

sentry:
  dsn: ${SENTRY_DSN_API:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: 0.1
  exception-resolver-order: -2147483647
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info
