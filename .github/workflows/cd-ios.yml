name: CD - iOS

# rc 는 EAS iOS 빌드 한도를 아끼려고 만들지 않는다. 정식 태그만 빌드 -> TestFlight -> 심사 제출.
on:
  push:
    tags:
      - 'v*'
      - '!v*-rc.*'
  # 빌드는 됐는데 제출에서 실패했을 때, 빌드 한도를 쓰지 않고 그 빌드로 제출부터 다시 한다.
  workflow_dispatch:
    inputs:
      tag:
        description: 정식 태그 (예 v1.2.6). 출시 노트도 이 태그 메시지에서 읽는다
        required: true
      build_id:
        description: 이미 만든 EAS 빌드 id. 비우면 새로 빌드한다
        required: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Parse tag
        id: parse
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid tag format: $TAG (expected vM.m.p)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-rn/package-lock.json

      - name: Install dependencies
        working-directory: app-rn
        run: npm ci

      # buildNumber 는 eas.json autoIncrement(remote)가 덮어쓴다. 여기 값은 자리만 채운다.
      - name: Write native build config
        working-directory: app-rn
        run: node scripts/write-native-build-config.js "${{ steps.parse.outputs.version }}" 1 "${{ steps.parse.outputs.version }}"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc-api-key.p8"

      # eas-cli 는 업로드 전에 runner 에서 config 를 평가하는데, EAS file 변수 GOOGLE_SERVICES_PLIST 는 클라우드에만 있다.
      # 업로드에서는 .easignore 가 이 파일을 빼므로 원격 빌드는 그대로 EAS 변수를 쓴다.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICES_PLIST_BASE64" | base64 -d > app-rn/GoogleService-Info.plist

      - name: EAS build
        id: build
        if: inputs.build_id == ''
        working-directory: app-rn
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ENV: prod
          EAS_UPDATE_CHANNEL: production
        run: |
          npx eas-cli@latest build --platform ios --profile production \
            --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          echo "id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")" >> "$GITHUB_OUTPUT"

      # eas submit 은 EXPO_ASC_* 를 읽지 않고 eas.json 의 키나 EAS 에 저장된 키만 쓴다. 로컬 제출은 저장된 키를 쓰도록 여기서만 주입한다.
      # BUILD_ENV 가 없으면 config 의 bundle id 가 .head 로 잡혀 엉뚱한 앱의 자격 증명을 찾는다.
      - name: EAS submit to App Store Connect
        working-directory: app-rn
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ENV: prod
          EAS_UPDATE_CHANNEL: production
          ASC_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_ID: ${{ inputs.build_id || steps.build.outputs.id }}
        run: |
          jq '.submit.production.ios += {ascApiKeyPath: env.ASC_KEY_PATH, ascApiKeyId: env.ASC_KEY_ID, ascApiKeyIssuerId: env.ASC_ISSUER_ID}' \
            eas.json > "$RUNNER_TEMP/eas.json" && mv "$RUNNER_TEMP/eas.json" eas.json
          npx eas-cli@latest submit --platform ios --profile production \
            --id "$BUILD_ID" --non-interactive --wait

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N

      # annotated 태그면 그 메시지를 "이번 버전의 새로운 기능"으로 쓴다.
      - name: Submit for review
        working-directory: app-rn
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
        run: |
          NOTES="버그 수정 및 안정성 개선"
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" --force
          if [[ "$(git cat-file -t "$TAG")" == "tag" ]]; then
            NOTES="$(git tag -l --format='%(contents:body)' "$TAG")"
            [[ -n "$NOTES" ]] || NOTES="$(git tag -l --format='%(contents:subject)' "$TAG")"
          fi
          fastlane ios submit_review version:"${{ steps.parse.outputs.version }}" release_notes:"$NOTES"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [[ "$STATUS" == "success" ]]; then
            TITLE="iOS 심사 제출 완료"; COLOR=5763719
          else
            TITLE="iOS CD 실패"; COLOR=15548997
          fi
          jq -n --arg t "$TITLE" --arg d "**${{ github.repository }}** $TAG" --argjson c "$COLOR" \
            --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{embeds: [{title: $t, description: $d, color: $c, fields: [{name: "Actions", value: "[View logs](\($u))"}]}]}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
