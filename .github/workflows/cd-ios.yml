name: CD - iOS

on:
  push:
    tags:
      - "v*"

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      is_rc: ${{ steps.parse.outputs.is_rc }}
      version_name: ${{ steps.parse.outputs.version_name }}
      build_number: ${{ steps.parse.outputs.build_number }}
      native_runtime_version: ${{ steps.parse.outputs.native_runtime_version }}
      profile: ${{ steps.parse.outputs.profile }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            RC="${BASH_REMATCH[5]}"
            if [[ -n "$RC" ]]; then
              IS_RC=true
              RC_N=$RC
              VN="${MAJOR}.${MINOR}.${PATCH}-rc.${RC}"
              PROFILE=production-rc
            else
              IS_RC=false
              RC_N=999
              VN="${MAJOR}.${MINOR}.${PATCH}"
              PROFILE=production
            fi
            BUILD_NUMBER=$((MAJOR * 1000000000 + MINOR * 1000000 + PATCH * 1000 + RC_N))
            echo "is_rc=$IS_RC" >> "$GITHUB_OUTPUT"
            echo "version_name=$VN" >> "$GITHUB_OUTPUT"
            echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
            echo "native_runtime_version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
            echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid tag format: $TAG (expected vM.m.p or vM.m.p-rc.N)"
            exit 1
          fi

  build:
    needs: parse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-rn/package-lock.json

      - name: Install dependencies
        working-directory: app-rn
        run: npm ci

      - name: Create native build config
        working-directory: app-rn
        run: |
          node scripts/write-native-build-config.js \
            "${{ needs.parse.outputs.version_name }}" \
            "${{ needs.parse.outputs.build_number }}" \
            "${{ needs.parse.outputs.native_runtime_version }}"

      - name: Verify Expo config
        working-directory: app-rn
        env:
          BUILD_ENV: prod
          EAS_UPDATE_CHANNEL: ${{ needs.parse.outputs.is_rc == 'true' && 'production-rc' || 'production' }}
        run: |
          CONFIG="$(npx expo config --json)"
          RUNTIME="$(node -e "const c = JSON.parse(process.argv[1]); console.log(c.runtimeVersion)" "$CONFIG")"
          if [[ "$RUNTIME" != "${{ needs.parse.outputs.native_runtime_version }}" ]]; then
            echo "::error::Expected runtimeVersion ${{ needs.parse.outputs.native_runtime_version }}, got $RUNTIME" >&2
            exit 1
          fi

      - name: Trigger EAS build
        working-directory: app-rn
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ENV: prod
          EAS_UPDATE_CHANNEL: ${{ needs.parse.outputs.is_rc == 'true' && 'production-rc' || 'production' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_APP }}
        run: |
          npx eas-cli@latest build \
            --platform ios \
            --profile "${{ needs.parse.outputs.profile }}" \
            --message "${GITHUB_REF_NAME} (${GITHUB_SHA})" \
            --non-interactive \
            ${{ needs.parse.outputs.is_rc == 'true' && '' || '--auto-submit-with-profile production' }}

      - name: Notify Discord (success)
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"iOS Build Success\",
                \"description\": \"**${{ github.repository }}** ${{ needs.parse.outputs.version_name }}\",
                \"color\": 5763719,
                \"fields\": [
                  {\"name\": \"Profile\", \"value\": \"${{ needs.parse.outputs.profile }}\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"inline\": true}
                ]
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify-failure:
    needs: [parse, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (failure)
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"iOS Build Failed\",
                \"description\": \"**${{ github.repository }}** ${{ github.ref_name }}\",
                \"color\": 15548997,
                \"fields\": [
                  {\"name\": \"Actions\", \"value\": \"[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": true}
                ]
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
