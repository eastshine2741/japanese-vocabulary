# Traefik 이 kotonoha.eastshine.dev 의 나머지 경로(/admin, /c/, /share-assets 등 제외)를 넘긴다.
map $http_user_agent $store_url {
  default                          "";
  "~*android"                      "https://play.google.com/store/apps/details?id=dev.eastshine.kotonoha";
  "~*(iphone|ipad|ipod)"           "https://apps.apple.com/app/id6806729387";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # dev 는 /<ns>/landing 아래로 들어오므로 Location 을 상대 경로로 둔다.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;
  gzip_min_length 512;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  error_page 404 /404.html;

  # QR 코드가 여기로 온다. 기기에 맞는 스토어로, 데스크톱은 다운로드 섹션으로.
  # add_header 를 쓰는 location 은 server 의 헤더를 물려받지 않아 보안 헤더를 다시 적는다.
  location ~ /\. {
    return 404;
  }

  location = /get {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    if ($store_url) {
      return 302 $store_url;
    }
    return 302 ./#download;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location ~* \.(?:css|js)$ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
