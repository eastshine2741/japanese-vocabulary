<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- og.png 원본. 고친 뒤: rsvg-convert -w 1200 -h 630 og/og.svg -o public/assets/og.png -->
  <defs>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0" stop-color="#16B364" stop-opacity=".22"/>
      <stop offset="1" stop-color="#16B364" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="iconClip"><rect x="72" y="64" width="56" height="56" rx="14"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#111418"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="1100" y="30" font-family="Noto Serif CJK JP" font-weight="900" font-size="200" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.5" writing-mode="tb">言の葉</text>

  <image xlink:href="icon.png" x="72" y="64" width="56" height="56" clip-path="url(#iconClip)"/>
  <text x="146" y="103" font-family="Noto Sans CJK KR" font-weight="700" font-size="30" fill="#ffffff">코토노하</text>
  <text x="280" y="103" font-family="Noto Sans CJK KR" font-weight="500" font-size="22" fill="#ffffff" fill-opacity=".5">Kotonoha</text>

  <g font-family="Noto Sans CJK KR" font-weight="900" font-size="78" letter-spacing="-3" fill="#ffffff">
    <text x="68" y="252">이 노래 가사,</text>
    <text x="68" y="350" fill="#52B98A">몇 %나</text>
    <text x="68" y="448">알아듣고 있나요?</text>
  </g>
  <text x="72" y="540" font-family="Noto Sans CJK KR" font-weight="500" font-size="28" fill="#9aa0a9">J-POP·애니 노래 가사로 배우는 일본어 단어 앱</text>

  <g transform="translate(760 150)">
    <rect width="372" height="330" rx="28" fill="#1a1e25"/>
    <text x="28" y="62" font-family="Noto Sans CJK JP" font-weight="700" font-size="22" fill="#4f5560">遠い街の灯り</text>
    <rect x="16" y="88" width="340" height="148" rx="18" fill="#16B364" fill-opacity=".1" stroke="#52B98A" stroke-width="2"/>
    <g font-family="Noto Sans CJK JP" font-weight="600" font-size="12" fill="#9aa0a9" text-anchor="middle"><text x="68" y="118">よぞら</text><text x="148" y="118">ほし</text></g>
    <text x="36" y="154" font-family="Noto Sans CJK JP" font-weight="900" font-size="32" fill="#ffffff">夜空<tspan fill="#8b929c">に</tspan>星<tspan fill="#8b929c">が</tspan>ひとつ</text>
    <g stroke-width="3"><line x1="38" y1="162" x2="98" y2="162" stroke="#5aa5f0"/><line x1="134" y1="162" x2="162" y2="162" stroke="#5aa5f0"/><line x1="198" y1="162" x2="290" y2="162" stroke="#5aa5f0"/></g>
    <g font-family="Noto Sans CJK KR" font-weight="600" font-size="12" fill="#c4c9d1" text-anchor="middle"><text x="68" y="180">밤하늘</text><text x="148" y="180">별</text><text x="244" y="180">하나</text></g>
    <text x="36" y="204" font-family="Noto Sans CJK KR" font-weight="500" font-size="13" fill="#9aa0a9">요조라니 호시가 히토츠</text>
    <text x="36" y="226" font-family="Noto Sans CJK KR" font-weight="500" font-size="15" fill="#c4c9d1">밤하늘에 별이 하나</text>
    <text x="28" y="284" font-family="Noto Sans CJK JP" font-weight="700" font-size="22" fill="#4f5560">静かな夜の風</text>
  </g>
</svg>
