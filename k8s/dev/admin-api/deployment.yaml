apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      # 켜 두면 `rabbitmq` 서비스가 RABBITMQ_PORT=tcp://... 를 주입하고, 앱이 그걸 포트로 읽어 기동에 실패한다.
      enableServiceLinks: false
      # 릴스 렌더가 NVDEC·CUDA 를 쓴다(reels/scripts/lib/gpu-composite.mjs). 호스트에 nvidia-container-toolkit 이 있어야 뜬다.
      # nvidia.com/gpu 를 요청하지 않는다 — 네임스페이스마다 뜨는 admin-api 가 GPU 하나를 같이 쓴다.
      runtimeClassName: nvidia
      containers:
        - name: admin-api
          image: ${ADMIN_API_IMAGE}
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/firebase/service-account.json
            - name: REELS_GPU
              value: "1"
            # GPU 렌더는 Chrome 이 코어 하나씩만 써서 3개를 같이 돌려도 한 개일 때와 시간이 거의 같다(83s → 92s).
            - name: ADMIN_REELS_RENDERER_CONCURRENCY
              value: "3"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
          envFrom:
            - configMapRef:
                name: admin-api-config
            - secretRef:
                name: admin-api-secret
          volumeMounts:
            # 운영자 수동 푸시(/admin/api/push/send)가 FCM 자격증명을 쓴다.
            - name: firebase-credentials
              mountPath: /var/secrets/firebase
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # 렌더 하나가 0.7GB 가량 더 쓴다 — 동시 렌더 3개 기준.
              memory: 5Gi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials
