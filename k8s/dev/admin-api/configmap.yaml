apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-api-config
data:
  MYSQL_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false"
  SPRING_PROFILES_ACTIVE: "dev"
  ADMIN_API_PORT: "8081"
  # domains:notification 이 classpath 로 끌고 온다. admin-api 자신은 Redis 를 호출하지 않는다.
  REDIS_HOST: redis
  PUSH_FIREBASE_ENABLED: "true"
  RABBITMQ_HOST: rabbitmq
