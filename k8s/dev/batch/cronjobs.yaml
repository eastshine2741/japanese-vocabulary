# batch 이미지는 --task=<name> 하나를 실행하고 종료한다 (CronTaskRunner).
# 즉시 실행: kubectl create job --from=cronjob/<name> <name>-manual-$(date +%s) -n <ns>
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: streak-reminder-evening
spec:
  # 연속 학습 알림 20:00 KST
  schedule: "0 20 * * *"
  timeZone: "Asia/Seoul"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: batch
              image: ${BATCH_IMAGE}
              imagePullPolicy: Never
              args:
                - "--task=streak-reminder"
                - "--slot=EVENING"
              env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/secrets/firebase/service-account.json
              envFrom:
                - configMapRef:
                    name: batch-config
                - secretRef:
                    name: batch-secret
              volumeMounts:
                - name: firebase-credentials
                  mountPath: /var/secrets/firebase
                  readOnly: true
          volumes:
            - name: firebase-credentials
              secret:
                secretName: firebase-credentials
---
