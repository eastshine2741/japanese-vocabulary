# Grafana 의 /metrics 는 인증 없이 열려 공개 라우트에서 뺀다. Prometheus 는 Service 로 직접 긁는다.
# IngressRoute 엔 ingress-shim 이 안 붙어 Certificate 를 명시하고, Middleware 는 namespace 를 넘어 참조할 수 없어 여기 둔다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
spec:
  secretName: grafana-tls
  dnsNames:
    - grafana.kotonoha.eastshine.dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.kotonoha.eastshine.dev`) && !PathPrefix(`/metrics`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-tls
---
# acme-challenge 는 cert-manager http01 solver 가 web 에 만드는 Ingress 몫이라 뺀다.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.kotonoha.eastshine.dev`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
      middlewares:
        - name: grafana-https-redirect
