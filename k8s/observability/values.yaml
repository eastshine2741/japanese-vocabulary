fullnameOverride: kps

crds:
  enabled: true

# ─────────────────────────────────────────────────────────────
# Prometheus
# ─────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d
    # 전체 ns의 ServiceMonitor/PodMonitor 픽업. selector는 release 라벨로만 필터.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

# ─────────────────────────────────────────────────────────────
# Alertmanager — warning/critical → Discord
# webhook URL은 Secret(alertmanager-discord)으로 마운트 (install.sh가 .env.prod에서 생성)
# ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # 항상 firing — repeat_interval(12h)마다 오는 heartbeat. 안 오면 알림 파이프라인이 죽은 것
        - receiver: discord
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: discord
          matchers:
            - severity =~ "critical|warning"
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
      - source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
        equal: [namespace]
      - target_matchers: [alertname = InfoInhibitor]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
            title: >-
              {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }}
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
              {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}
            message: |-
              {{ range .Alerts }}**{{ .Labels.severity }}** {{ with .Labels.pod }}`{{ . }}` {{ end }}{{ with .Labels.node }}`{{ . }}` {{ end }}{{ with .Labels.instance }}`{{ . }}`{{ end }}
              {{ with .Annotations.summary }}{{ . }}{{ else }}{{ .Annotations.description }}{{ end }}
              {{ end }}
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    secrets:
      - alertmanager-discord
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

# ─────────────────────────────────────────────────────────────
# Grafana — internal only (port-forward 접근)
# ─────────────────────────────────────────────────────────────
grafana:
  # adminPassword는 install.sh의 --set-string으로 주입
  defaultDashboardsTimezone: Asia/Seoul
  # 단일 replica + RWO PVC → Multi-Attach 회피
  deploymentStrategy:
    type: Recreate
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  persistence:
    enabled: true
    type: pvc
    storageClassName: hcloud-volumes
    accessModes: [ReadWriteOnce]
    size: 10Gi

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      jvm-micrometer:
        gnetId: 4701
        revision: 10
        datasource: Prometheus
  # spring-boot-3 (#19004): grafana.com 다운로드는 ${DS_PROMETHEUS} 치환 안 됨 →
  # 직접 치환한 JSON을 dashboards/ 에 두고 ConfigMap으로 sidecar에 먹임 (install.sh 참조).

# ─────────────────────────────────────────────────────────────
# 끄거나 가벼운 컴포넌트
# ─────────────────────────────────────────────────────────────
kubeEtcd:
  enabled: false           # k3s는 sqlite/embedded etcd 기본 — 스크랩 불가
kubeControllerManager:
  enabled: false           # k3s는 control plane 컴포넌트 노출 안 함
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
