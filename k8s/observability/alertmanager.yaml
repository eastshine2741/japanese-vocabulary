# Alertmanager 설정 — install.sh가 webhook_url 자리를 .env.prod의 DISCORD_ALERT_WEBHOOK_URL로 채워
# Secret(monitoring/alertmanager-config)으로 만들고, values.yaml의 configSecret이 그것을 쓴다.
# webhook_url_file을 안 쓰는 이유: prometheus-operator(v0.91)의 설정 검증이 discord_configs의
# webhook_url_file을 모르는 필드로 거부해, 설정 전체가 반영되지 않는다.
global:
  resolve_timeout: 5m
route:
  receiver: "null"
  group_by: [namespace, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # 항상 firing — repeat_interval(12h)마다 오는 heartbeat. 안 오면 알림 파이프라인이 죽은 것
    - receiver: discord
      matchers:
        - alertname = "Watchdog"
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"
    - receiver: discord
      matchers:
        - severity =~ "critical|warning"
inhibit_rules:
  - source_matchers: [severity = critical]
    target_matchers: [severity =~ warning|info]
    equal: [namespace, alertname]
  - source_matchers: [severity = warning]
    target_matchers: [severity = info]
    equal: [namespace, alertname]
  - source_matchers: [alertname = InfoInhibitor]
    target_matchers: [severity = info]
    equal: [namespace]
  - target_matchers: [alertname = InfoInhibitor]
receivers:
  - name: "null"
  - name: discord
    discord_configs:
      - webhook_url: ${DISCORD_ALERT_WEBHOOK_URL}
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }}
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
          {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}
        # 무엇이 문제인지: pod·workload·node 라벨이 있으면 그것을, 없으면 service·job·instance를 보여준다.
        # (kube-state-metrics 기반 알림의 service/job은 exporter 자신이라 대상이 아니다)
        # 본문은 대상 이름이 들어 있는 description 우선
        # (기본 규칙들의 summary는 "One or more targets are unreachable." 같은 일반 문장이다)
        message: |-
          {{ range .Alerts }}**{{ .Labels.severity }}**{{ if or .Labels.pod .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.job_name .Labels.persistentvolumeclaim .Labels.node }}{{ with .Labels.pod }} pod=`{{ . }}`{{ end }}{{ with .Labels.container }} container=`{{ . }}`{{ end }}{{ with .Labels.deployment }} deployment=`{{ . }}`{{ end }}{{ with .Labels.statefulset }} statefulset=`{{ . }}`{{ end }}{{ with .Labels.daemonset }} daemonset=`{{ . }}`{{ end }}{{ with .Labels.job_name }} job_name=`{{ . }}`{{ end }}{{ with .Labels.persistentvolumeclaim }} pvc=`{{ . }}`{{ end }}{{ with .Labels.node }} node=`{{ . }}`{{ end }}{{ else }}{{ with .Labels.service }} service=`{{ . }}`{{ end }}{{ with .Labels.job }} job=`{{ . }}`{{ end }}{{ with .Labels.instance }} instance=`{{ . }}`{{ end }}{{ end }}
          {{ with .Annotations.description }}{{ . }}{{ else }}{{ .Annotations.summary }}{{ end }}
          {{ end }}
