# /etc/rancher/k3s/config.yaml (control-plane: hel1-1, NoSchedule taint)
# k3s-server 프로세스만 ~1.2GB를 쓰므로 kube-reserved를 크게 잡는다.
# allocatable = 3820Mi - 300 - 1200 - 200 ≈ 2120Mi
kubelet-arg:
  - "system-reserved=memory=300Mi"
  - "kube-reserved=memory=1200Mi"
  - "eviction-hard=memory.available<200Mi,imagefs.available<5%,nodefs.available<5%"
