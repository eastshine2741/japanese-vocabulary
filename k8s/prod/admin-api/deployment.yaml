apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: admin-api
          image: ${ADMIN_API_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/firebase/service-account.json
          envFrom:
            - configMapRef:
                name: admin-api-config
            - secretRef:
                name: admin-api-secret
          volumeMounts:
            # 운영자 수동 푸시(/admin/api/push/send)가 FCM 자격증명을 쓴다.
            - name: firebase-credentials
              mountPath: /var/secrets/firebase
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials
