apiVersion: v1
kind: Secret
metadata:
  name: admin-api-secret
type: Opaque
stringData:
  MYSQL_USER: "${MYSQL_USER}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  # prod 는 평문 ADMIN_PASSWORD 를 쓰지 않는다. sha256 해시만 넣는다.
  ADMIN_PASSWORD_SHA256: "${ADMIN_PASSWORD_SHA256}"
  ADMIN_TOKEN_SECRET: "${ADMIN_TOKEN_SECRET}"
  # 로컬 PC 가사 싱크 실행기 토큰. 비면 실행기 API 가 닫힌다.
  ADMIN_LYRIC_SYNC_AGENT_TOKEN: "${ADMIN_LYRIC_SYNC_AGENT_TOKEN}"
