apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-web
  template:
    metadata:
      labels:
        app: landing-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: landing-web
          image: ${LANDING_WEB_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 80
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
