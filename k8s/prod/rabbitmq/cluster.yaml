apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
spec:
  replicas: 1
  image: rabbitmq:4.1-management

  # CRD 기본값은 requests 1000m/2Gi 다. 명시하지 않으면 4GB 노드 한 대의 절반을 브로커가 가져간다.
  # 곡 분석 큐는 workId 만 싣는 깨우기 신호라 이 정도면 충분하다.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  persistence:
    storage: 5Gi
    storageClassName: hcloud-volumes

  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_prometheus
    additionalConfig: |
      # 곡 하나를 분석하는 데 수 분이 걸린다. 외부 API 가 느려진 날에도 채널이 끊기지 않도록
      # 1시간으로 둔다. worker 의 작업 락(30분)보다 길어야 한다.
      consumer_timeout = 3600000

      # 컨테이너 메모리 한도 기준으로 잡힌다.
      vm_memory_high_watermark.relative = 0.6

      disk_free_limit.absolute = 1GB
