# 브로커 계정. 이름(`rabbitmq-default-user`)과 두 키(`username`/`password`)는 오퍼레이터가 만들던
# 것과 같다 — api/admin-api/worker 의 secretKeyRef 가 그대로 쓴다.
#
# `10-users.json` 이 하나 더 있는 이유: definitions 를 쓰면 RabbitMQ 가 기본 계정 시딩을 건너뛴다
# (`Will not seed default virtual host and user: have definitions to load...`). RABBITMQ_DEFAULT_USER
# 환경변수는 무시되므로 계정도 definitions 로 선언해야 하고, 그러면 비밀번호가 import 파일에 들어간다.
# 그래서 토폴로지(ConfigMap)와 계정(이 Secret)을 나눠 같은 디렉터리에 projected volume 으로 얹는다.
#
# 평문 `password` 는 import 시 RabbitMQ 가 해시한다 — password_hash 를 직접 계산할 필요가 없다.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-default-user
type: Opaque
stringData:
  username: kotonoha
  password: ${RABBITMQ_PASSWORD}
  10-users.json: |
    {
      "users": [
        {
          "name": "kotonoha",
          "password": "${RABBITMQ_PASSWORD}",
          "tags": ["administrator"]
        }
      ],
      "permissions": [
        {
          "user": "kotonoha",
          "vhost": "/",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ]
    }
