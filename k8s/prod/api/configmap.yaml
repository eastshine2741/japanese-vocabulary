apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  MYSQL_HOST: mysql
  MYSQL_DATABASE: "${MYSQL_DATABASE}"
  REDIS_HOST: redis
  SPRING_PROFILES_ACTIVE: "prod"
  RABBITMQ_HOST: rabbitmq
  OBJECT_STORAGE_ENDPOINT: "${OBJECT_STORAGE_ENDPOINT}"
  OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET}"
  OBJECT_STORAGE_PUBLIC_BASE_URL: "${OBJECT_STORAGE_PUBLIC_BASE_URL}"
  SHARE_PUBLIC_BASE_URL: "https://kotonoha.eastshine.dev"
  SHARE_APPLE_APP_ID: "${SHARE_APPLE_APP_ID}"
  SHARE_ANDROID_SHA256_FINGERPRINTS: "${SHARE_ANDROID_SHA256_FINGERPRINTS}"
  # 같은 네임스페이스의 share-web. 랜딩이 이 index.html 에 카드 메타를 끼운다.
  SHARE_WEB_INDEX_URL: "http://share-web/index.html"
