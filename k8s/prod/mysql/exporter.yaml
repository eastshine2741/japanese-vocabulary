# 사이드카로 붙이면 StatefulSet 파드 템플릿이 바뀌어 MySQL 이 재시작되므로 따로 띄운다.
# 계정(exporter@'10.42.%')은 deploy.sh 가 만든다. 계정이 생기기 전엔 mysql_up=0 으로만 보인다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqld-exporter
  template:
    metadata:
      labels:
        app: mysqld-exporter
    spec:
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.20.0
          args:
            - --mysqld.address=mysql:3306
            - --mysqld.username=exporter
            - --collect.perf_schema.eventsstatements
            - --collect.perf_schema.eventsstatements.limit=50
            - --collect.perf_schema.eventsstatements.digest_text_limit=200
            # 추적 합계를 container_memory_rss 와 겹쳐 봐야 RSS 증가가 MySQL 할당인지 malloc 단편화인지 갈린다.
            - --collect.perf_schema.memory_events
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-exporter
                  key: password
          ports:
            - name: metrics
              containerPort: 9104
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
