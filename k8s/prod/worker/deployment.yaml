apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # 켜 두면 `rabbitmq` 서비스가 RABBITMQ_PORT=tcp://... 를 주입하고, 앱이 그걸 포트로 읽어 기동에 실패한다.
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      # 사전(JMdict SQLite)은 운영 MySQL 버퍼 풀을 나눠 쓰지 않도록 파일로 받는다. 못 받으면 파드가 뜨지 않아 이전 파드가 계속 처리한다.
      # URL 은 deploy.sh 가 치환하므로 사전 버전을 바꾸면 파드가 다시 뜬다.
      initContainers:
        - name: fetch-dictionary
          image: curlimages/curl:8.10.1
          # 오류 페이지가 200 으로 와도 받아지므로 SQLite 헤더를 확인한다. 아니면 모든 단어가 뜻 없이 분석된다.
          command:
            - sh
            - -c
            - curl -fsSL --retry 5 -o /dictionary/jmdict.sqlite "${DICTIONARY_URL}" && head -c 15 /dictionary/jmdict.sqlite | grep -q "SQLite format 3"
          volumeMounts:
            - name: dictionary
              mountPath: /dictionary
      containers:
        - name: worker
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/firebase/service-account.json
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secret
          volumeMounts:
            - name: firebase-credentials
              mountPath: /var/secrets/firebase
              readOnly: true
            - name: dictionary
              mountPath: /dictionary
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials
        - name: dictionary
          emptyDir: {}
