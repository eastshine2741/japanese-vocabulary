apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # 켜 두면 `rabbitmq` 서비스가 RABBITMQ_PORT=tcp://... 를 주입하고, 앱이 그걸 포트로 읽어 기동에 실패한다.
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/firebase/service-account.json
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secret
          volumeMounts:
            - name: firebase-credentials
              mountPath: /var/secrets/firebase
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials
