# kotonoha.eastshine.dev
#   /admin/api/*  -> admin-api  (prefix 유지: 컨트롤러 매핑이 /admin/api/**)
#   /admin/*      -> admin-web  (prefix 제거: nginx 는 root 에서 서빙)
#
# 표준 Ingress 가 아니라 IngressRoute 를 쓰는 이유: 두 백엔드가 같은 호스트를 path 로
# 나눠 쓰는데 stripPrefix 는 admin-web 쪽에만 걸려야 한다. Ingress 에서 미들웨어는
# metadata.annotations 로 지정하고 그 값은 Ingress 오브젝트 전체에 적용된다 — 한 Ingress 안의
# path 마다 다른 미들웨어를 줄 문법이 없다. admin-api 까지 prefix 가 벗겨지면 컨트롤러 매핑과
# 어긋나 전부 404 다. IngressRoute 는 middlewares 가 route 항목 안에 있어 path 별로 갈린다.
# priority 를 명시하는 이유: /admin/api 가 /admin 보다 먼저 잡혀야 한다. 생략하면 traefik 이
# 매처 문자열 길이로 순서를 정하는데, 두 규칙의 길이 차이가 몇 글자뿐이라 의존하기에 위태롭다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-web-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /admin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kotonoha.eastshine.dev`) && PathPrefix(`/admin/api`)
      kind: Rule
      priority: 100
      services:
        - name: admin-api
          port: 8081
    - match: Host(`kotonoha.eastshine.dev`) && PathPrefix(`/admin`)
      kind: Rule
      priority: 50
      services:
        - name: admin-web
          port: 80
      middlewares:
        - name: admin-web-strip-prefix
  tls:
    secretName: admin-tls
---
# 브라우저로 http://kotonoha.eastshine.dev/admin 을 열어도 https 로 넘긴다.
# /.well-known/acme-challenge/* 는 매칭하지 않으므로 cert-manager http01 solver 와 겹치지 않는다.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin-http-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kotonoha.eastshine.dev`) && PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: admin-web
          port: 80
      middlewares:
        - name: admin-https-redirect
