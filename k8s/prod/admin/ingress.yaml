# kotonoha.eastshine.dev
#   /admin/api/*  -> admin-api  (prefix 유지: 컨트롤러 매핑이 /admin/api/**)
#   /admin/*      -> admin-web  (prefix 제거: nginx 는 root 에서 서빙)
#
# IngressRoute 를 쓰는 이유: stripPrefix 는 admin-web 에만 걸려야 하는데, Ingress 는 미들웨어가
# annotation 으로 오브젝트 전체에 적용돼 path 별로 나눌 수 없다 (admin-api 까지 벗기면 전부 404).
# priority 를 명시하는 이유: /admin/api 가 /admin 보다 먼저 매칭돼야 하고, traefik 기본 순서(매처 길이)는 차이가 몇 글자뿐이라 위태롭다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-web-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /admin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kotonoha.eastshine.dev`) && PathPrefix(`/admin/api`)
      kind: Rule
      priority: 100
      services:
        - name: admin-api
          port: 8081
    - match: Host(`kotonoha.eastshine.dev`) && PathPrefix(`/admin`)
      kind: Rule
      priority: 50
      services:
        - name: admin-web
          port: 80
      middlewares:
        - name: admin-web-strip-prefix
  tls:
    secretName: admin-tls
---
# 브라우저로 http://kotonoha.eastshine.dev/admin 을 열어도 https 로 넘긴다.
# /.well-known/acme-challenge/* 는 매칭하지 않으므로 cert-manager http01 solver 와 겹치지 않는다.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin-http-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kotonoha.eastshine.dev`) && PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: admin-web
          port: 80
      middlewares:
        - name: admin-https-redirect
