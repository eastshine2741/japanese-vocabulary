# admin-web(/admin) 과 admin-api(/admin/api) 가 같은 호스트를 공유하므로 인증서는 한 장이다.
# 두 IngressRoute 가 이 secret 을 참조한다. IngressRoute 에는 ingress-shim 이 붙지 않아 Certificate 를 명시한다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-tls
spec:
  secretName: admin-tls
  dnsNames:
    - kotonoha.eastshine.dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
