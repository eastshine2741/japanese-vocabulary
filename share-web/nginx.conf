# Traefik 이 /share-assets(dev 는 /<ns>/share-assets) 를 벗겨 넘긴다. index.html 은 api 가 받아 가 카드 메타를 끼운다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 파일명에 내용 해시가 붙어 있다.
  location ~ ^/(_expo|assets)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }
}
